name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: dec_to_hex-windows
            exe_name: dec_to_hex.exe
          - os: macos-latest
            artifact_name: dec_to_hex-macos
            exe_name: dec_to_hex
          - os: ubuntu-latest
            artifact_name: dec_to_hex-linux
            exe_name: dec_to_hex

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests before build
        run: pytest -q

      - name: Build
        run: python scripts/build_exe.py --onefile

      - name: Verify artifact exists
        shell: bash
        run: |
          echo "Contents of dist/:"
          ls -la dist/
          test -f "dist/${{ matrix.exe_name }}" \
            || { echo "::error::Artifact dist/${{ matrix.exe_name }} not found"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.exe_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach artifacts to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/dec_to_hex-windows/dec_to_hex.exe release/dec_to_hex-windows.exe
          cp artifacts/dec_to_hex-macos/dec_to_hex      release/dec_to_hex-macos
          cp artifacts/dec_to_hex-linux/dec_to_hex      release/dec_to_hex-linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
